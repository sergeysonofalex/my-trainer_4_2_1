<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Датчик цвета и модуль EV3</title>
<style>

:root{
  --ink:#1f4fa3; --ink-d:#14336b; --board:#2e5a4c; --wood:#b4813f; --wood-d:#8a6128;
  --chalk:#f7f6ee; --hl:#ffe14d; --hl-soft:#fff6bf; --red:#d6362c; --ok:#23925a; --ok-soft:#d9f3e4;
  --grid:#cfe2f4; --paper:#fffffe; --txt:#1b2540;
  --hand:"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE","Marker Felt",cursive;
  --body:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--body);font-size:19px;line-height:1.4;color:var(--txt);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;min-height:100vh;
}
.margin{position:fixed;left:clamp(10px,4vw,56px);top:0;bottom:0;width:2px;background:var(--red);opacity:.5;pointer-events:none}
.wrap{position:relative;max-width:1120px;margin:0 auto;padding:16px clamp(12px,3vw,28px) 60px clamp(22px,7vw,84px)}
button{font-family:inherit}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* доска */
.board{background:var(--board);color:var(--chalk);border:9px solid var(--wood);border-radius:10px;padding:12px 20px;
  display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 5px 0 var(--wood-d)}
.board h1{font:700 clamp(23px,4vw,35px)/1.15 var(--hand);margin:0}
.board p{margin:4px 0 0;font-size:17px;opacity:.92}
.hud{display:flex;gap:10px;align-items:center}
.pill{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 16px;font-weight:700;white-space:nowrap}
.mute{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:var(--chalk);font-size:20px;cursor:pointer}
.mute[aria-pressed="true"]{opacity:.55;text-decoration:line-through}

/* закладки уровней */
.tabs{display:flex;gap:8px;margin:20px 0 0;flex-wrap:wrap;min-height:44px}
.tab{display:flex;gap:8px;align-items:center;font-weight:700;font-size:17px;padding:8px 16px 8px 10px;border:3px solid var(--ink);border-bottom:none;
  border-radius:12px 12px 0 0;background:#fff;color:#6b7aa0}
.tab b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#dfe7f6;font-size:15px}
.tab.on{background:var(--hl);color:var(--ink-d)}
.tab.on b{background:var(--ink);color:#fff}
.tab.done{color:var(--ink-d)}
.tab.done b{background:var(--ok);color:#fff}

/* лист */
.sheet{background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:0 16px 16px 16px;padding:22px clamp(14px,3vw,30px) 28px}
.sheet h2{font:700 clamp(23px,3.4vw,30px)/1.2 var(--hand);color:var(--ink-d);margin:0 0 6px}
.task{margin:0 0 14px;max-width:62ch}
.btn{font:700 20px var(--body);padding:12px 26px;border-radius:12px;border:3px solid var(--ink-d);background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--ink-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink-d)}
.btn.alt{background:#fff;color:var(--ink-d)}

.say{min-height:3.4em;border:3px solid;border-radius:12px;padding:9px 14px;margin:0 0 16px;display:flex;align-items:center}
.say.idle{background:var(--hl-soft);border-color:#e0c200}
.say.ok{background:var(--ok-soft);border-color:var(--ok)}
.say.bad{background:#ffe3df;border-color:var(--red)}
.say b{margin-right:.4em}

.pass{margin-top:22px;padding:16px 18px;border:3px dashed var(--ok);background:var(--ok-soft);border-radius:14px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pass p{margin:0;font-weight:700}

/* старт */
.start{display:grid;gap:18px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:70ch}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps b.n{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff}
.who{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.who input{font:inherit;padding:10px 14px;border:3px solid var(--ink);border-radius:10px;min-width:240px;background:#fff}

/* уровень 1 */
.bank{display:flex;flex-wrap:wrap;gap:12px;padding:14px;margin-bottom:20px;border:3px dashed var(--ink);border-radius:14px;background:#f4f8ff;min-height:76px}
.tag{font:700 18px var(--body);background:var(--c,#ffe14d);color:var(--txt);border:2px solid var(--ink-d);border-radius:6px;padding:10px 14px;
  transform:rotate(var(--r,0deg));cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:3px 3px 0 rgba(20,51,107,.25)}
.tag.sel{outline:4px solid var(--ink);outline-offset:3px}
.tag.lift{opacity:.3}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.08);box-shadow:6px 8px 0 rgba(20,51,107,.25);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px 22px}
.card{display:flex;flex-direction:column;gap:10px}
.photo{position:relative;display:grid;place-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px;min-height:150px}
.photo::before{content:"";position:absolute;top:-13px;left:50%;width:76px;height:24px;margin-left:-38px;background:rgba(255,225,77,.8);transform:rotate(-3deg)}
.photo img{display:block;max-width:100%;height:auto}
.slot{font:700 18px var(--body);min-height:58px;border:3px dashed var(--ink);border-radius:10px;background:#fff;color:#7a89ad;cursor:pointer;padding:8px 12px}
.slot.hover{background:var(--hl-soft);border-style:solid;color:var(--ink-d)}
.slot.filled{border:2px solid var(--ink-d);border-radius:6px;background:var(--c,#b9efd0);color:var(--txt);cursor:default;box-shadow:3px 3px 0 rgba(20,51,107,.25)}
.slot.filled::before{content:"✓ ";color:var(--ok)}

/* уровень 2 */
.pairs{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(56px,16vw,200px);align-items:stretch;margin:0 14px}
.col{display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.wire{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.wire.good{stroke:var(--ok)}
.wire.bad{stroke:var(--red);stroke-dasharray:2 10}
.wire.tmp{stroke:var(--ink);opacity:.7}
.blk,.nm{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.blk{display:grid;place-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px}
.blk img{display:block;max-width:100%;height:auto;pointer-events:none}
.nm{display:flex;align-items:center;text-align:left;background:var(--hl-soft);border:2px solid #cfae00;border-radius:6px;padding:12px 16px;
  font:700 18px var(--body);color:var(--txt);box-shadow:3px 3px 0 rgba(20,51,107,.2);min-height:64px}
.dot{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:#fff;border:4px solid var(--ink);z-index:2}
.blk .dot{right:-17px}
.nm .dot{left:-17px}
.sel{outline:4px solid var(--ink);outline-offset:3px}
.sel .dot,.target .dot{background:var(--hl)}
.target{outline:4px dashed var(--ink);outline-offset:3px}
.ok{border-color:var(--ok)!important;cursor:default}
.ok .dot{background:var(--ok);border-color:var(--ok)}
.nm.ok{background:var(--ok-soft)}

/* уровень 3 */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.qdots{display:flex;gap:7px}
.qdots span{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.qdots span.ok{background:var(--ok);border-color:var(--ok)}
.qdots span.now{background:var(--hl)}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:760px){.qgrid{grid-template-columns:1fr}}
.qimg{display:grid;place-items:center;min-height:240px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:16px}
.qimg img{display:block;max-width:100%;height:auto}
.opts{display:grid;gap:10px;margin-bottom:12px}
.opt{text-align:left;font:700 18px var(--body);padding:12px 16px;border:3px solid var(--ink);border-radius:10px;background:#fff;color:var(--txt);cursor:pointer}
.opt:hover:not(:disabled){background:var(--hl-soft)}
.opt.no{border-color:var(--red);background:#ffe3df;color:#8a4a44;text-decoration:line-through}
.opt.yes{border-color:var(--ok);background:var(--ok-soft)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}

/* итог */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:10px 0 16px}
.big{font:700 clamp(46px,9vw,76px)/1 var(--hand);color:var(--ink)}
.stars{font-size:44px;color:#e9a800;letter-spacing:4px}
.grade{font-weight:700}
.fix{list-style:none;margin:8px 0 22px;padding:0;display:grid;gap:10px;max-width:640px}
.fix li{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 12px}
.fix .mini{flex:none;width:100px;display:grid;place-items:center}
.fix img{display:block;max-width:100%;height:auto}

.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
@media print{
  body{background:#fff}.margin,.btn,.mute,.tabs{display:none!important}
  .sheet{border:none}
}

/* ---- картинка подключения ---- */
.map{position:relative;max-width:900px;margin:0 auto 8px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px}
.map>img{display:block;width:100%;height:auto}
.slot.hs{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;min-height:0;padding:0;border-radius:50%;background:rgba(255,246,191,.96);
  border:3px dashed var(--ink);color:var(--ink-d);font:700 20px var(--body);display:grid;place-items:center;box-shadow:none}
.slot.hs.hover{background:var(--hl);border-style:solid}
.slot.hs.filled{border:3px solid var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:50%;box-shadow:none;cursor:default;z-index:3}
.slot.hs.filled::before{content:none}
.lab{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);width:max-content;max-width:150px;background:var(--c,#ffe14d);
  border:2px solid var(--ink-d);border-radius:6px;padding:4px 8px;font:700 15px/1.2 var(--body);color:var(--txt);text-align:center;box-shadow:2px 2px 0 rgba(20,51,107,.25);pointer-events:none}

/* ---- порты ---- */
.portbrick{max-width:780px;margin:0 auto 18px;background:#e7e9ee;border:4px solid #7c8294;border-radius:18px;padding:14px 16px;display:grid;gap:12px}
.prow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.slot.port{min-height:96px;border:3px dashed var(--ink);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;color:var(--ink-d)}
.port b{font:700 30px var(--hand)}
.port .l2{font:700 14px/1.2 var(--body);color:var(--txt)}
.slot.port.filled{border:2px solid var(--ink-d);border-radius:10px;background:var(--c,#b9efd0);box-shadow:3px 3px 0 rgba(20,51,107,.25)}
.slot.port.filled::before{content:none}
.bscreen{height:60px;background:#2b2f36;border-radius:10px;display:grid;place-items:center;color:#cfd5c8;font:700 22px var(--hand);letter-spacing:3px}
.rule{margin:0 0 14px;padding:10px 14px;border-left:6px solid var(--red);background:#fff3f1;font-weight:700}

/* ---- корзины ---- */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.bins{grid-template-columns:1fr}}
.slot.bin{min-height:170px;border:3px dashed var(--ink);border-radius:14px;background:#fff;padding:12px;display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:left;color:var(--txt);cursor:pointer}
.bin h3{margin:0;font:700 20px/1.2 var(--hand);color:var(--ink-d)}
.bin .chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--c);border:2px solid var(--ink-d);border-radius:6px;padding:6px 10px;font-weight:700;font-size:16px;box-shadow:2px 2px 0 rgba(20,51,107,.2)}

/* ---- тест ---- */
.qtext{margin:0 0 14px;padding:16px 18px;background:#fff;border:3px solid var(--ink);border-radius:14px;font:700 22px/1.3 var(--hand);color:var(--ink-d)}
.qwide{max-width:760px}

/* ---- эмулятор ---- */
.emu{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.emu{grid-template-columns:1fr}}
.stage{padding:10px 120px 14px;justify-self:center}
@media (max-width:560px){.stage{padding:10px 40px 14px;zoom:.85}}
.brick{position:relative;width:320px;height:440px;background:#eceef1;border-radius:18px;border:3px solid #9096a6;box-shadow:0 8px 0 rgba(20,51,107,.18)}
.cap{position:absolute;left:0;top:0;width:100%;height:196px;background:#a9aebb;border-radius:15px 15px 0 0}
.bezel{position:absolute;left:34px;top:26px;width:252px;height:156px;background:#15181c;border-radius:8px}
.lcd{position:absolute;left:14px;top:12px;width:224px;height:132px;background:#cdd3c6;color:#1c241a;font:700 11px/1.1 "Lucida Console","Courier New",monospace;overflow:hidden;transition:background .8s}
.lcd.off{background:#b4baad}
.lcd .ls{display:flex;justify-content:space-between;padding:3px 8px;border-bottom:1.5px solid #1c241a}
.lcd .lts{display:flex;gap:4px;padding:6px 6px 0}
.lcd .lt{width:44px;height:22px;border:1.5px solid #1c241a;border-bottom:none;border-radius:4px 4px 0 0;display:grid;place-items:center;font-size:14px}
.lcd .lt.on{background:#e6ebdf}
.lcd .lp{margin:0 6px;border:1.5px solid #1c241a;height:64px;padding:3px;background:#e6ebdf}
.lcd .lr{padding:3px 5px}
.lcd .lr.hl{background:#1c241a;color:#cdd3c6}
.lcd .dlg{position:absolute;left:28px;top:46px;width:168px;height:80px;background:#e6ebdf;border:2px solid #1c241a;display:grid;grid-template-rows:1fr auto}
.lcd .dlg svg{width:30px;height:30px;margin:6px auto 0;display:block;stroke:#1c241a;fill:none;stroke-width:2.4;stroke-linecap:round}
.lcd .dbtn{display:flex;justify-content:center;gap:18px;border-top:2px solid #1c241a;padding:4px}
.lcd .dbtn span{border:2px solid #1c241a;border-radius:4px;width:36px;text-align:center;font-size:14px;padding:1px 0}
.lcd .dbtn span.hl{background:#1c241a;color:#e6ebdf}
.glow{position:absolute;left:62px;top:218px;width:196px;height:166px;border-radius:50%;background:radial-gradient(closest-side,rgba(110,230,60,.6),rgba(110,230,60,0));opacity:0;transition:opacity .5s;pointer-events:none}
.glow.on{opacity:1}
.bb{position:absolute;border:2px solid #7c8294;background:#b8bcc8;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;z-index:1}
.bb:active,.bb.press{transform:translateY(3px)}
.bb.back{left:26px;top:214px;width:70px;height:30px;border-radius:4px 4px 12px 4px}
.bb.up{left:128px;top:228px;width:64px;height:40px;border-radius:12px 12px 4px 4px}
.bb.down{left:128px;top:332px;width:64px;height:40px;border-radius:4px 4px 12px 12px}
.bb.left{left:78px;top:276px;width:54px;height:48px;border-radius:24px 4px 4px 24px}
.bb.right{left:188px;top:276px;width:54px;height:48px;border-radius:4px 24px 24px 4px}
.bb.center{left:134px;top:278px;width:52px;height:44px;border-radius:8px;background:#6a6f7b;border-color:#4a4e58;z-index:2}
.bb.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(214,54,44,.4)}}
.foot{position:absolute;left:0;bottom:0;width:100%;height:54px;background:#a9aebb;border-radius:0 0 15px 15px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#f1f3f8;font:700 28px var(--hand);letter-spacing:3px}
.lego{width:32px;height:32px;background:#d6362c;border:2px solid #fff;border-radius:4px;color:#ffe14d;font:700 9px/28px Arial,sans-serif;text-align:center;letter-spacing:0}
.ptr{position:absolute;display:flex;align-items:center;pointer-events:none;z-index:6;animation:nudge .9s ease-in-out infinite}
.ptr b{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #111;font:700 24px var(--body)}
.ptr svg{width:58px;height:34px;flex:none;transform:rotate(var(--a,0deg))}
@keyframes nudge{50%{translate:var(--dx,8px) var(--dy,0px)}}
.es{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.es li{display:flex;gap:10px;align-items:center;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:700}
.es li b{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff}
.es li.now{background:var(--hl-soft);border-color:#cfae00}
.es li.done{background:var(--ok-soft);border-color:var(--ok)}
.es li.done b{background:var(--ok)}
.btn.small{font-size:16px;padding:8px 16px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.jump{font:700 16px var(--body);padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink-d);cursor:pointer}
.jump:hover{background:var(--hl-soft)}
@media (prefers-reduced-motion:reduce){.ptr,.bb.pulse{animation:none}}

[hidden]{display:none!important}

.glow.red{background:radial-gradient(closest-side,rgba(230,50,40,.7),rgba(230,50,40,0))}
.lcd .boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px}
.lcd .boot b{font:700 20px Arial,sans-serif;letter-spacing:2px}
.lcd .boot .bar{width:150px;height:10px;border:2px solid #1c241a}
.lcd .boot .bar i{display:block;height:100%;background:#1c241a;animation:bootbar 1.8s linear forwards}
@keyframes bootbar{from{width:0}to{width:100%}}
.meter{position:relative;height:22px;border:3px solid var(--ink);border-radius:999px;background:#fff;margin:0 0 14px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:#9aa7c7}
.meter i.r{background:var(--red)}
.meter i.g{background:var(--ok)}
.meter u{position:absolute;left:33.3%;top:0;bottom:0;width:3px;background:var(--ink);opacity:.5}

/* ===== компактность под экран ноутбука ===== */
body{font-size:17px}
.wrap{padding:8px clamp(12px,3vw,28px) 14px clamp(22px,6vw,70px)}
.board{border-width:6px;padding:6px 16px;box-shadow:0 3px 0 var(--wood-d)}
.board h1{font-size:clamp(20px,2.6vw,27px)}
.board p{margin:0;font-size:14px}
.pill{padding:3px 12px;font-size:15px}
.mute{width:34px;height:34px;font-size:16px}
.tabs{margin-top:8px;min-height:0;gap:6px}
.tab{font-size:14px;padding:5px 12px 5px 8px;border-width:3px}
.tab b{width:22px;height:22px;font-size:13px}
.sheet{padding:10px clamp(12px,2vw,22px) 12px}
.sheet h2{font-size:clamp(20px,2.4vw,25px);margin:0 0 2px}
.task{margin:0 0 6px;font-size:16px;max-width:none}
.say{min-height:2.3em;padding:5px 12px;margin:0 0 8px;font-size:16px}
.btn{font-size:17px;padding:8px 20px;border-width:2px}
.pass{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(960px,calc(100vw - 32px));margin:0;z-index:40;
  box-shadow:0 5px 0 rgba(20,51,107,.25),0 0 0 6px rgba(255,255,255,.85);padding:10px 16px}
body.has-pass .wrap{padding-bottom:96px}

/* старт */
.start{display:grid;gap:12px}
.hero{font:700 clamp(30px,4.4vw,46px)/1.1 var(--hand)!important;margin:0!important}
.hero .c1{color:#d6362c}.hero .c2{color:#1f4fa3}.hero .c3{color:#23925a}
.lead{margin:0;font-size:clamp(18px,1.9vw,22px);max-width:none}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.bc{display:flex;gap:12px;align-items:center;padding:10px 14px;border:3px solid var(--c);border-radius:16px;background:var(--bg);box-shadow:0 4px 0 var(--c)}
.bc .n{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;font:700 26px var(--hand)}
.bc b{display:block;font-size:20px;line-height:1.15;color:#1b2540}
.bc small{display:block;font-size:15px;line-height:1.2;color:#44506f}
.who{gap:12px}
.who label{font:700 21px var(--hand);color:var(--ink-d)}
.who input{font-size:20px;padding:8px 14px;min-width:260px}
.btn.go{font:700 26px var(--hand);padding:10px 34px;background:#23925a;border-color:#146b3d;box-shadow:0 5px 0 #146b3d}

/* датчики */
.bank{padding:8px;margin-bottom:12px;min-height:0;gap:8px}
.tag{font-size:16px;padding:7px 11px}
.cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 12px}
.card{gap:8px}
.photo{min-height:0;padding:10px;height:var(--ph,150px)}
.photo::before{top:-11px;width:60px;height:20px;margin-left:-30px}
.photo img{max-height:calc(var(--ph,150px) - 24px);width:auto;height:auto;max-width:100%}
.slot{min-height:44px;font-size:16px;padding:6px 8px}

/* линии */
.pairs{margin:0 14px}
.col{gap:8px}
.blk{height:var(--rowh,60px);padding:4px 10px}
.blk img{height:calc(var(--rowh,60px) - 14px);width:auto;max-width:100%;object-fit:contain}
.nm{min-height:var(--rowh,60px);height:var(--rowh,60px);padding:4px 14px;font-size:clamp(14px,1.5vw,17px)}

/* шнуры */
.cords{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);gap:0 clamp(26px,5vw,76px);align-items:center;max-width:1000px;margin:0 auto}
.cords .wires{z-index:1}
.cport,.cscreen{z-index:2}
.cscreen{position:relative}
.cords .wire{stroke:#2b2f36;stroke-width:7}
.cords .wire.good{stroke:#2b2f36}
.cords .wire.tmp{stroke:var(--ink);opacity:.75}
.cords .wire.bad{stroke:var(--red)}
.dcol,.pcol{display:flex;flex-direction:column;gap:8px;justify-content:center}
.dev{position:relative;height:var(--dh,66px);display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 10px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.dev img{height:calc(var(--dh,66px) - 14px);width:auto;max-width:92px;object-fit:contain;pointer-events:none}
.dev span{font:700 15px/1.15 var(--body);pointer-events:none}
.dev.L{justify-content:flex-start}.dev.L .dot{right:-17px}
.dev.R .dot{left:-17px}
.cbrick{background:#e7e9ee;border:4px solid #7c8294;border-radius:16px;padding:8px 20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:stretch}
.cport{position:relative;height:var(--dh,66px);width:66px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:grid;place-items:center;font:700 28px var(--hand);color:var(--ink-d);touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.cport.L .dot{left:-19px}.cport.R .dot{right:-19px}
.cport.ok{background:var(--ok-soft)}
.cscreen{background:#2b2f36;border-radius:10px;display:grid;place-items:center;color:#cfd5c8;font:700 26px var(--hand);letter-spacing:3px}

/* куда подключить */
.tag.pic{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;width:112px;text-align:center;font-size:13px;line-height:1.1}
.tag.pic img{height:var(--ti,46px);width:auto;max-width:96px;object-fit:contain;pointer-events:none;background:#fff;border-radius:4px}
.pbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot.port2{position:relative;height:var(--ph2,74px);display:flex;align-items:center;gap:8px;padding:4px 10px;border:3px dashed var(--ink);border-radius:10px;background:#fff;color:var(--ink-d);text-align:left;cursor:pointer}
.slot.port2 b{flex:none;font:700 30px var(--hand);width:30px;text-align:center}
.slot.port2 .pc{display:flex;align-items:center;gap:6px;min-width:0;font:700 12px/1.1 var(--body);color:var(--txt);overflow-wrap:anywhere}
.slot.port2 .pc img{height:calc(var(--ph2,74px) - 20px);width:auto;max-width:50px;object-fit:contain;background:#fff;border-radius:4px}
.slot.port2.filled{border:3px solid var(--ok);background:var(--ok-soft);border-radius:10px;box-shadow:none;cursor:default}
.slot.port2.filled::before{content:none}
.p2brick{max-width:880px;margin:6px auto 0;background:#e7e9ee;border:4px solid #7c8294;border-radius:16px;padding:8px 12px;display:grid;gap:6px}
.p2brick .prow{gap:8px}
.p2brick .bscreen{height:30px;font-size:18px;border-radius:8px}

/* тест и вопросы */
.qhead{margin-bottom:6px}
.qtext{font-size:clamp(18px,2vw,23px);padding:10px 14px;margin:0 0 10px}
.qwide{max-width:none}
.qwide .opts{grid-template-columns:1fr 1fr}
@media (max-width:700px){.qwide .opts{grid-template-columns:1fr}}
.opt{font-size:clamp(16px,1.6vw,19px);padding:9px 14px}
.opts{gap:8px;margin-bottom:8px}
.qimg{min-height:0;height:var(--qh,230px);padding:10px}
.qimg img{max-height:calc(var(--qh,230px) - 24px);width:auto;height:auto;max-width:100%}
.row{margin-bottom:8px;gap:10px}
.qgrid{gap:16px}
.score{margin:4px 0 8px}
.fix{margin:4px 0 12px;max-height:38vh;overflow:auto}
.es li{padding:6px 12px}
.meter{margin:0 0 10px;height:18px}

.top{display:flex;gap:14px;align-items:center;margin:0 0 8px}
.top h2{flex:none;margin:0!important;white-space:nowrap}
.top h2 small{font:700 14px var(--body);color:#6b7aa0}
.top .say{flex:1;margin:0}
@media (max-width:820px){.top{flex-wrap:wrap}.top h2{white-space:normal}}
.blk{padding:2px 10px}
.blk img{height:calc(var(--rowh,60px) - 8px)}
.col{gap:6px}

.sheet h2 small#round{font:700 15px var(--body);color:#5a4a00;margin-left:10px;background:#fff3bf;border:2px solid #e0c200;border-radius:999px;padding:1px 12px;vertical-align:middle}
.rev{margin:0 0 8px;padding:8px 10px;border:3px solid var(--ink);border-radius:12px;background:#fff}
.rev h3{margin:0 0 6px;font:700 18px var(--hand);color:var(--ink-d)}
.rev .rr{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:5px 8px;border-radius:8px;margin-bottom:4px;font-size:15px;line-height:1.25}
.rr.good{background:var(--ok-soft)}.rr.bad{background:#ffe3df}.rr b{white-space:nowrap}
.emud{margin:0 0 10px}
.emud summary{cursor:pointer;font-weight:700;color:var(--ink-d);padding:6px 0}
.emud h3{margin:6px 0 4px;font:700 17px var(--hand)}

</style>
</head>

let muted=false,ac=null,customSound=null,keyHandler=null,keyUpHandler=null;

function ctx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function note(f,t0,dur,type,vol){
  const a=ctx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.14,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
function beep(ok){
  if(muted)return;
  try{ok?(note(660,0,.2),note(880,.09,.2)):(note(240,0,.2,'sawtooth'),note(190,.12,.2,'sawtooth'))}catch(e){}
}
function tick(){if(muted)return;try{note(1300,0,.05,'square',.05)}catch(e){}}
function powerOffSound(){
  if(muted)return;
  if(customSound){const a=new Audio(customSound);a.play().catch(synthOff);return}
  synthOff();
}
function synthOff(){
  try{[[784,0],[659,.16],[523,.32],[392,.48]].forEach(([f,t],i)=>note(f,t,i===3?.55:.2,'square',.1))}catch(e){}
}
function powerOnSound(){

  try{[[392,0],[523,.12],[659,.24],[784,.36]].forEach(([f,t])=>note(f,t,.2,'square',.08))}catch(e){}
}

/* ---------- перетаскивание «название → место» ---------- */
function dnd(scope,o){
  let sel=null;
  const clearSel=()=>{if(sel)sel.classList.remove('sel');sel=null};
  const clearHover=()=>$$('.slot.hover',scope).forEach(s=>s.classList.remove('hover'));
  const toggle=tag=>{if(sel===tag)clearSel();else{clearSel();sel=tag;tag.classList.add('sel')}};
  function place(tag,slot){
    clearSel();clearHover();
    if(o.accept(tag,slot)){st.done.add(tag.dataset.id);hud();beep(true);o.onOk(tag,slot)}
    else{st.mist.add(tag.dataset.id);shake(tag);shake(slot);beep(false);o.onBad(tag,slot)}
  }
  function wire(tag){
    tag.addEventListener('pointerdown',e=>{
      if(e.button>0)return;
      const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;
      try{tag.setPointerCapture(e.pointerId)}catch(_){}
      const slotAt=(x,y)=>{const t=document.elementFromPoint(x,y),s=t&&t.closest('.slot');return s&&!s.classList.contains('filled')&&scope.contains(s)?s:null};
      const mv=ev=>{
        if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){
          moved=true;clearSel();ghost=tag.cloneNode(true);ghost.classList.add('ghost');document.body.appendChild(ghost);tag.classList.add('lift');
        }
        if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';clearHover();const s=slotAt(ev.clientX,ev.clientY);if(s)s.classList.add('hover')}
      };
      const end=(ev,cancel)=>{
        tag.removeEventListener('pointermove',mv);tag.removeEventListener('pointerup',up);tag.removeEventListener('pointercancel',cn);
        clearHover();
        if(moved){
          ghost.remove();tag.classList.remove('lift');
          if(!cancel){const s=slotAt(ev.clientX,ev.clientY);if(s)place(tag,s)}
        }else if(!cancel)toggle(tag);
      };
      const up=ev=>end(ev,false),cn=ev=>end(ev,true);
      tag.addEventListener('pointermove',mv);tag.addEventListener('pointerup',up);tag.addEventListener('pointercancel',cn);
    });
    tag.addEventListener('click',e=>{if(e.detail===0)toggle(tag)});
  }
  $$('.tag',scope).forEach(wire);
  scope.addEventListener('click',e=>{
    const s=e.target.closest('.slot');
    if(s&&sel&&!s.classList.contains('filled')&&scope.contains(s)&&scope.contains(sel))place(sel,s);
  });
}
function makeTags(bank,list){
  shuffle(list).forEach((it,i)=>{
    const b=document.createElement('button');b.type='button';b.className='tag';b.dataset.id=it.id;b.dataset.key=it.key;b.textContent=it.name;
    b.style.setProperty('--c',COLORS[i%COLORS.length]);b.style.setProperty('--r',((i*37)%5-2)+'deg');
    bank.appendChild(b);
  });
}

/* ---------- универсальное «соедини линией / шнуром» ---------- */
function linker(root,svg,cfg){
  const NS='http://www.w3.org/2000/svg',links=[];
  let drag=null,tmp=null,selEl=null;
  const both=cfg.src+','+cfg.dst;
  const isS=el=>el.matches(cfg.src);
  const dot=el=>{const d=$('.dot',el).getBoundingClientRect(),p=root.getBoundingClientRect();return[d.left+d.width/2-p.left,d.top+d.height/2-p.top]};
  const curve=(a,b)=>{const s=b[0]>=a[0]?1:-1,k=Math.max(40,Math.abs(b[0]-a[0])*.5);return `M${a[0]},${a[1]}C${a[0]+s*k},${a[1]} ${b[0]-s*k},${b[1]} ${b[0]},${b[1]}`};
  const mk=cls=>{const p=document.createElementNS(NS,'path');p.setAttribute('class','wire '+cls);svg.appendChild(p);return p};
  const redraw=()=>links.forEach(l=>l.p.setAttribute('d',curve(dot(l.s),dot(l.d))));
  addEventListener('resize',redraw);
  if(window.ResizeObserver)new ResizeObserver(redraw).observe(root);
  const clearSel=()=>{if(selEl)selEl.classList.remove('sel');selEl=null};
  const clearTarget=()=>$$('.target',root).forEach(x=>x.classList.remove('target'));
  function connect(s,d){
    clearSel();clearTarget();
    const r=cfg.check(s,d);
    if(r.ok){
      s.classList.add('ok');d.classList.add('ok');s.removeAttribute('tabindex');d.removeAttribute('tabindex');
      const p=mk('good');links.push({s,d,p});redraw();pop(s);pop(d);
      st.done.add(s.dataset.id);hud();beep(true);cfg.onOk(s,d);
    }else{
      st.mist.add(s.dataset.id);
      const p=mk('bad');p.setAttribute('d',curve(dot(s),dot(d)));setTimeout(()=>p.remove(),800);
      shake(s);shake(d);beep(false);cfg.onBad(s,d,r);
    }
  }
  function tap(el){
    if(selEl&&selEl!==el&&isS(selEl)!==isS(el)){const o=selEl;isS(el)?connect(el,o):connect(o,el)}
    else if(selEl===el)clearSel();
    else{clearSel();selEl=el;el.classList.add('sel')}
  }
  root.addEventListener('pointerdown',e=>{
    const el=e.target.closest(both);
    if(!el||el.classList.contains('ok')||e.button>0)return;
    e.preventDefault();drag={el,x:e.clientX,y:e.clientY,moved:false};
    try{root.setPointerCapture(e.pointerId)}catch(_){}
  });
  root.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.moved=true;clearSel();tmp=mk('tmp')}
    if(drag.moved){
      const p=root.getBoundingClientRect(),pt=[e.clientX-p.left,e.clientY-p.top];
      tmp.setAttribute('d',isS(drag.el)?curve(dot(drag.el),pt):curve(pt,dot(drag.el)));
      clearTarget();
      const t=document.elementFromPoint(e.clientX,e.clientY),o=t&&t.closest(isS(drag.el)?cfg.dst:cfg.src);
      if(o&&!o.classList.contains('ok'))o.classList.add('target');
    }
  });
  const finish=(e,cancel)=>{
    if(!drag)return;const d=drag;drag=null;clearTarget();
    if(tmp){tmp.remove();tmp=null}
    if(cancel)return;
    if(d.moved){
      const t=document.elementFromPoint(e.clientX,e.clientY),o=t&&t.closest(isS(d.el)?cfg.dst:cfg.src);
      if(o&&!o.classList.contains('ok'))isS(d.el)?connect(d.el,o):connect(o,d.el);
    }else tap(d.el);
  };
  root.addEventListener('pointerup',e=>finish(e,false));
  root.addEventListener('pointercancel',e=>finish(e,true));
  root.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const el=e.target.closest(both);
    if(el&&!el.classList.contains('ok')){e.preventDefault();tap(el)}
  });
  return {redraw};
}

/* ---------- тест с вариантами ---------- */
function runQuiz(c){
  const queue=shuffle(c.items);let idx=0;
  function render(){
    const it=queue[idx];
    const opts=it.options?shuffle(it.options):shuffle([it.correct,...shuffle(c.items.filter(x=>x!==it)).slice(0,3).map(x=>x.correct)]);
    const head=`<div class="qhead"><h2>${c.title}</h2><div class="qdots" aria-label="Вопрос ${idx+1} из ${queue.length}">${queue.map((_,i)=>`<span class="${i<idx?'ok':(i===idx?'now':'')}"></span>`).join('')}</div></div>`;
    const side=`<div class="opts" id="opts">${opts.map(o=>`<button class="opt" type="button" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="row"><button class="btn alt" id="hintBtn" type="button">Подсказка</button><button class="btn" id="next" type="button" hidden>${idx===queue.length-1?c.lastLabel:'Дальше'}</button></div>
      <div class="say idle" id="say">Выбери верный ответ.</div>`;
    $('#sheet').innerHTML=it.img
      ? head+`<div class="qgrid" data-fit><div class="qimg">${imgTag(it.img,420,260,2)}</div><div>${side}</div></div>`
      : head+`<div class="qwide"><p class="qtext">${esc(it.q)}</p>${side}</div>`;
    let solved=false;
    $('#hintBtn').onclick=()=>{if(!solved)say('idle',`<span><b>Подсказка.</b>${esc(it.hint)}</span>`)};
    $('#opts').addEventListener('click',e=>{
      const b=e.target.closest('.opt');if(!b||solved||b.disabled)return;
      if(b.dataset.v===it.correct){
        solved=true;b.classList.add('yes');pop(b);$$('.opt').forEach(x=>x.disabled=true);
        st.done.add(it.id);hud();beep(true);
        say('ok',`<span><b>Верно!</b>${esc(it.fact)}</span>`);
        $$('.qdots span')[idx].className='ok';
        $('#hintBtn').hidden=true;$('#next').hidden=false;$('#next').focus({preventScroll:true});
      }else{
        st.mist.add(it.id);b.classList.add('no');b.disabled=true;shake(b);beep(false);
        say('bad','<span><b>Не то.</b>Попробуй другой ответ. Можно нажать «Подсказка».</span>');
      }
    });
    $('#next').onclick=()=>{idx++;if(idx<queue.length)render();else c.end()};
  }
  render();
}

  tabs(3);toTop();
  $('#sheet').innerHTML=`
    <div class="top"><h2>Подключи шнуры <small>1 из 2</small></h2><div class="say idle" id="say">Протяни шнур от устройства к порту. Буквенные порты — для моторов, числовые — для датчиков.</div></div>
    <div class="cords" id="cords" data-fit>
      <svg class="wires" aria-hidden="true"></svg>
      <div class="dcol" id="dl"></div>
      <div class="cbrick">
        <div class="pcol">${['A','B','C','D'].map(l=>`<div class="cport L" data-kind="m" data-p="${l}" tabindex="0" role="button">${l}<i class="dot"></i></div>`).join('')}</div>
        <div class="cscreen">EV3</div>
        <div class="pcol">${['1','2','3','4'].map(l=>`<div class="cport R" data-kind="s" data-p="${l}" tabindex="0" role="button">${l}<i class="dot"></i></div>`).join('')}</div>
      </div>
      <div class="dcol" id="dr"></div>
    </div>`;
  const list=shuffle(CORD);
  list.forEach((it,i)=>{
    const side=i<4?'L':'R';
    const d=document.createElement('div');d.className='dev '+side;d.dataset.id=it.id;d.dataset.kind=it.kind;d.tabIndex=0;d.setAttribute('role','button');
    d.innerHTML=imgTag(it.img,92,60,1.2)+`<span>${esc(it.name)}</span><i class="dot"></i>`;
    $(i<4?'#dl':'#dr').appendChild(d);
  });
  linker($('#cords'),$('#cords svg'),{
    src:'.dev',dst:'.cport',
    check:(s,d)=>({ok:s.dataset.kind===d.dataset.kind}),
    onOk:(s,d)=>{
      say('ok',`<span><b>Верно!</b>${s.dataset.kind==='m'?'Моторы подключают к буквенным портам.':'Датчики подключают к числовым портам.'}</span>`);
      if($$('.dev.ok').length===CORD.length)passBar('Часть 1 пройдена! Все шнуры подключены правильно.','Дальше: куда подключить →',screenConn2);
    },
    onBad:(s,d)=>say('bad',`<span><b>Не тот порт.</b>${s.dataset.kind==='m'?'Это мотор. Его подключают к порту с буквой.':'Это датчик. Его подключают к порту с цифрой.'}</span>`)
  });
}
function screenConn2(){
  tabs(3);toTop();
  const ports=(arr,kind)=>arr.map(l=>`<div class="slot port2" data-kind="${kind}" tabindex="0"><b>${l}</b><span class="pc"></span></div>`).join('');
  $('#sheet').innerHTML=`
    <div class="top"><h2>Куда подключить? <small>2 из 2</small></h2><div class="say idle" id="say">Перетащи устройство в любой свободный порт. Главное — не перепутать цифры и буквы!</div></div>
    <div class="pbank" id="bank" data-fit aria-label="Устройства"></div>
    <div class="p2brick" id="p2">
      <div class="prow">${ports(['A','B','C','D'],'m')}</div>
      <div class="bscreen">EV3</div>
      <div class="prow">${ports(['1','2','3','4'],'s')}</div>
    </div>`;
  shuffle(CARD).forEach((it,i)=>{
    const b=document.createElement('button');b.type='button';b.className='tag pic';b.dataset.id=it.id;b.dataset.kind=it.kind;
    b.style.setProperty('--c',COLORS[i%COLORS.length]);b.style.setProperty('--r',((i*37)%5-2)+'deg');
    b.innerHTML=imgTag(it.img,96,46,1.3)+`<span>${esc(it.name)}</span>`;
    $('#bank').appendChild(b);
  });
  dnd($('#sheet'),{
    accept:(t,s)=>t.dataset.kind===s.dataset.kind,
    onOk:(t,s)=>{
      const it=CARD.find(x=>x.id===t.dataset.id);
      s.classList.add('filled');s.style.setProperty('--c',tagColor(t));
      $('.pc',s).innerHTML=imgTag(it.img,60,50,1)+`<span>${esc(it.name)}</span>`;
      pop(s);t.remove();
      say('ok',`<span><b>Верно!</b>${it.kind==='m'?'Мотор — в порт с буквой.':'Датчик — в порт с цифрой.'}</span>`);
      if(!$('#bank .tag'))passBar('Блок «Подключение» пройден!','Дальше: блоки программы →',screenLines);
    },
    onBad:(t,s)=>say('bad',`<span><b>Не тот порт.</b>${t.dataset.kind==='m'?'Это мотор — ему нужен порт с буквой.':'Это датчик — ему нужен порт с цифрой.'}</span>`)
  });
}

/* ================= 4. БЛОКИ: соедини линией ================= */
function screenLines(){
  tabs(4);toTop();
  $('#sheet').innerHTML=`
    <div class="top"><h2>Соедини блок с названием</h2><div class="say idle" id="say">Проведи линию от блока к его названию (или нажми на блок, потом на название).</div></div>
    <div class="pairs" id="pairs" data-fit><svg class="wires" aria-hidden="true"></svg><div class="col" id="cl"></div><div class="col" id="cr"></div></div>`;
  shuffle(LINES).forEach(it=>{
    const b=document.createElement('div');b.className='blk';b.dataset.id=it.id;b.tabIndex=0;b.setAttribute('role','button');
    b.innerHTML=imgTag(it.img,300,150,1.5)+'<i class="dot"></i>';$('#cl').appendChild(b);
  });
  shuffle(LINES).forEach(it=>{
    const n=document.createElement('button');n.type='button';n.className='nm';n.dataset.id=it.id;
    n.innerHTML=`<i class="dot"></i><span>${esc(it.name)}</span>`;$('#cr').appendChild(n);

    onOk:(b,n)=>{
      n.disabled=true;
      const it=LINES.find(x=>x.id===b.dataset.id);
      say('ok',`<span><b>Верно!</b>${esc(it.fact)}</span>`);
      if(LINES.every(x=>st.done.has(x.id)))passBar('Блок пройден! Все блоки соединены.','Дальше: какой блок? →',screenQuiz);
    },
    onBad:()=>say('bad','<span><b>Эта пара не подходит.</b>Рассмотри блок внимательнее и попробуй другое название.</span>')
  });
}

/* ================= 6. ЭМУЛЯТОР ВКЛЮЧЕНИЯ ================= */
function screenOn(){
  tabs(6);toTop();
  const RED=900,GREEN=2700;
  const TXT=['Нажми среднюю кнопку и держи','Загорелся красный — отпусти кнопку','Жди: модуль загрузится сам и станет зелёным'];
  let phase='off',holding=false,hints=true,t1=null,t2=null,raf=null,t0=0,round=1;const log=[[],[],[]];
  $('#sheet').innerHTML=`
    <h2>Включи модуль EV3 правильно <small id="round">Попытка 1 из 3</small></h2>
    <p class="task">Нажми среднюю кнопку и держи, пока она не загорится красным. Тогда отпусти: дальше модуль загрузится сам и загорится зелёным. Зелёный значит: модуль готов к работе. Тренируемся три раза, баллы здесь не начисляются.</p>
    <div class="emu">
      <div class="stage"><div class="brick" id="brick">
        <div class="cap"></div>
        <div class="bezel"><div class="lcd off" id="lcd"></div></div>
        <div class="glow" id="glow"></div>
        <button class="bb back"   data-btn="back"   type="button" aria-label="Кнопка Назад"></button>
        <button class="bb up"     data-btn="up"     type="button" aria-label="Вверх"></button>
        <button class="bb left"   data-btn="left"   type="button" aria-label="Влево"></button>
        <button class="bb right"  data-btn="right"  type="button" aria-label="Вправо"></button>
        <button class="bb down"   data-btn="down"   type="button" aria-label="Вниз"></button>
        <button class="bb center" data-btn="center" type="button" aria-label="Центральная кнопка (держи)"></button>
        <div class="foot"><span>EV3</span><span class="lego">LEGO</span></div>
      </div></div>
      <div>
        <ol class="es" id="es">${TXT.map((s,i)=>`<li><b>${i+1}</b><span>${s}</span></li>`).join('')}</ol>
        <div class="meter" aria-hidden="true"><i id="mfill"></i><u></u></div>
        <div class="say idle" id="say"></div>
        <div id="rev" hidden></div>
        <div class="row"><button class="btn alt small" id="hintT" type="button" aria-pressed="true">Подсказки: включены</button></div>
        <div class="row" id="again" hidden><button class="btn small" id="retry" type="button">Попытка 2 из 3 →</button></div>
      </div>
    </div>`;
  const brick=$('#brick'),lcd=$('#lcd'),glow=$('#glow'),fill=$('#mfill'),center=$('.bb.center',brick);
  let released=false;
  function screen(s){
    if(s==='off'){lcd.className='lcd off';lcd.innerHTML='';return}
    lcd.className='lcd';
    if(s==='boot'){lcd.innerHTML='<div class="boot"><b>LEGO</b><span>MINDSTORMS EV3</span><div class="bar"><i></i></div></div>';return}
    lcd.innerHTML=`<div class="ls"><span></span><span>EV3</span><span>USB ▮▮</span></div>
      <div class="lts"><div class="lt on">▶</div><div class="lt">▤</div><div class="lt">▦</div><div class="lt">✎</div></div>
      <div class="lp"><div class="lr hl">▶ DriveForward</div><div class="lr">▶ ColorStop</div></div>`;
  }
  function pointer(){
    $$('.ptr',brick).forEach(p=>p.remove());center.classList.remove('pulse');
    const show=hints&&((phase==='off')||(phase==='red'&&holding));
    if(!show)return;
    center.classList.add('pulse');
    const p=document.createElement('div');p.className='ptr';
    p.innerHTML=`<svg viewBox="0 0 60 34" style="--a:225deg"><path d="M2 12h34V3l22 14-22 14v-9H2z" fill="#d6362c" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg><b>${phase==='off'?'1':'2'}</b>`;
    p.style.cssText=`left:${center.offsetLeft+center.offsetWidth-14}px;top:${center.offsetTop+center.offsetHeight-14}px;--dx:-6px;--dy:-6px`;
    brick.appendChild(p);
  }
  const prog=()=>phase==='ready'?3:(phase==='red'?(released?2:1):0);
  function list(){$$('#es li').forEach((li,i)=>{const p=prog();li.className=i<p?'done':(i===p?'now':'');$('b',li).textContent=i<p?'✓':i+1})}
  function prompt(){say('idle',`<span><b>Задание.</b>${hints?'Нажми и держи среднюю кнопку, пока она не загорится красным.':'Включи модуль.'}</span>`)}
  function stopTimers(){clearTimeout(t1);clearTimeout(t2);cancelAnimationFrame(raf)}
  function loop(){
    const p=Math.min(1,(performance.now()-t0)/GREEN);
    fill.style.width=p*100+'%';fill.className=phase==='red'?'r':(phase==='ready'?'g':'');
    if(phase!=='ready')raf=requestAnimationFrame(loop);
  }
  function reset(){
    stopTimers();phase='off';holding=false;released=false;glow.className='glow';screen('off');fill.style.width='0';fill.className='';
    list();pointer();
  }
  function startHold(){
    if(holding||phase!=='off')return;
    holding=true;released=false;t0=performance.now();tick();list();pointer();
    say('idle','<span><b>Держи!</b>Не отпускай, пока не загорится красный…</span>');
    loop();
    t1=setTimeout(()=>{
      phase='red';glow.className='glow red on';screen('boot');
      beep(true);list();pointer();
      say('ok',`<span><b>Загорелся красный!</b>${holding?'Отпусти кнопку — дальше модуль загрузится сам.':'Модуль загружается.'}</span>`);
    },RED);
    t2=setTimeout(()=>{
      phase='ready';glow.className='glow on';screen('menu');
      powerOnSound();
      fill.style.width='100%';fill.className='g';
      if(holding){
        log[round-1].push('Шаг 2: кнопку не отпустили, когда загорелся красный');
        say('bad','<span><b>Модуль включился, но…</b>кнопку нужно было отпустить, когда загорелся красный. Он загружается сам.</span>');
      }else say('ok','<span><b>Горит зелёный!</b>Модуль загрузился сам и готов к работе.</span>');
      list();pointer();
      if(round<3){
        $('#retry').textContent=`Попытка ${round+1} из 3 →`;$('#again').hidden=false;
      }else{
        EMU_LOG.on=log.map(a=>a.slice());
        $('#es').hidden=true;$('.meter').hidden=true;$('#rev').hidden=false;$('#rev').innerHTML=reviewHTML(log);
        $('#retry').textContent='Потренироваться ещё';$('#again').hidden=false;
        say('ok','<span><b>Тренировка закончена!</b>Три попытки выполнены. Посмотри, где были ошибки.</span>');
        passBar('Тренировка пройдена! Три попытки выполнены.','Дальше: выключение модуля →',screenEmu);
      }
    },GREEN);
  }
  function release(){
    if(!holding)return;
    holding=false;
    if(phase==='ready'){list();return}
    if(phase==='red'){
      released=true;beep(true);list();pointer();
      say('ok','<span><b>Правильно!</b>Кнопку отпустили вовремя. Модуль загружается сам — жди зелёный свет.</span>');
      return;
    }
    log[round-1].push('Шаг 1: кнопку отпустили слишком рано, до красного света');beep(false);shake(center);
    say('bad','<span><b>Ты отпустил слишком рано.</b>Держи кнопку, пока она не загорится красным. Попробуй снова.</span>');
    reset();
  }
  center.addEventListener('pointerdown',e=>{
    if(e.button>0)return;e.preventDefault();
    try{center.setPointerCapture(e.pointerId)}catch(_){}
    startHold();
  });
  center.addEventListener('pointerup',release);
  center.addEventListener('pointercancel',release);
  brick.addEventListener('click',e=>{
    const b=e.target.closest('.bb');if(!b||b===center)return;
    tick();shake(b);
    log[round-1].push(`Нажата кнопка ${({back:'«Назад»',up:'«Вверх»',down:'«Вниз»',left:'«Влево»',right:'«Вправо»'})[b.dataset.btn]}: модуль включают средней кнопкой`);
    say('bad','<span><b>Не та кнопка.</b>Модуль включают средней (центральной) кнопкой.</span>');
  });
  keyHandler=e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    e.preventDefault();if(!e.repeat)startHold();
  };
  keyUpHandler=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();release()}};
  $('#hintT').onclick=()=>{
    hints=!hints;const b=$('#hintT');b.setAttribute('aria-pressed',hints);b.textContent='Подсказки: '+(hints?'включены':'выключены');
    pointer();if(phase==='off'&&!holding)prompt();
  };
  $('#retry').onclick=()=>{
    $$('.pass').forEach(x=>x.remove());
    if(round<3)round++;else{round=1;log.forEach(a=>a.length=0)}
    $('#round').textContent=`Попытка ${round} из 3`;$('#es').hidden=false;$('.meter').hidden=false;$('#rev').hidden=true;
    $('#again').hidden=true;reset();prompt();
  };
  screen('off');list();pointer();prompt();
}

/* ================= 6. ЭМУЛЯТОР ВЫКЛЮЧЕНИЯ ================= */
function screenEmu(){
  tabs(7);toTop();
  const STEPS=[
    {btn:'back',  dir:'r', txt:'Нажми кнопку «Назад» — левую верхнюю', ok:'Появилось окно выключения. Сейчас выбран крестик ✕ — это «отмена».'},
    {btn:'right', dir:'l', txt:'Нажми «Вправо», чтобы выбрать галочку ✓', ok:'Теперь выбрана галочка ✓ — «да, выключить».'},
    {btn:'center',dir:'tl',txt:'Нажми центральную кнопку, чтобы подтвердить', ok:'Модуль выключается…'}
  ];
  const NAMES={back:'«Назад»',right:'«Вправо»',left:'«Влево»',up:'«Вверх»',down:'«Вниз»',center:'центральная'};
  let step=0,hints=true,busy=false,finished=false,round=1;const log=[[],[],[]];
  $('#sheet').innerHTML=`
    <h2>Выключи модуль EV3 правильно <small id="round">Попытка 1 из 3</small></h2>
    <p class="task">В конце урока модуль нужно выключить. Нажимай кнопки на модуле по порядку. Тренируемся три раза, баллы здесь не начисляются.</p>
    <div class="emu">
      <div class="stage"><div class="brick" id="brick">
        <div class="cap"></div>
        <div class="bezel"><div class="lcd" id="lcd"></div></div>
        <div class="glow on" id="glow"></div>
        <button class="bb back"   data-btn="back"   type="button" aria-label="Кнопка Назад"></button>
        <button class="bb up"     data-btn="up"     type="button" aria-label="Вверх"></button>
        <button class="bb left"   data-btn="left"   type="button" aria-label="Влево"></button>
        <button class="bb right"  data-btn="right"  type="button" aria-label="Вправо"></button>
        <button class="bb down"   data-btn="down"   type="button" aria-label="Вниз"></button>
        <button class="bb center" data-btn="center" type="button" aria-label="Центральная кнопка"></button>
        <div class="foot"><span>EV3</span><span class="lego">LEGO</span></div>
      </div></div>
      <div>
        <ol class="es" id="es">${STEPS.map((s,i)=>`<li data-i="${i}"><b>${i+1}</b><span>${s.txt}</span></li>`).join('')}</ol>
        <div class="say idle" id="say"></div>
        <div id="rev" hidden></div>
        <div class="row">
          <button class="btn alt small" id="hintT" type="button" aria-pressed="true">Подсказки: включены</button>
          <button class="btn alt small" id="snd" type="button">Загрузить звук EV3…</button>
          <input type="file" id="sndFile" accept="audio/*" hidden>
        </div>
        <div class="row" id="again" hidden><button class="btn small" id="retry" type="button">Включить и повторить</button></div>
      </div>
    </div>`;
  const brick=$('#brick'),lcd=$('#lcd'),glow=$('#glow');
  const btns={};$$('.bb',brick).forEach(b=>btns[b.dataset.btn]=b);

  function screen(state){
    if(state===3){lcd.className='lcd off';lcd.innerHTML='';return}
    lcd.className='lcd';
    const dlg=state>0?`<div class="dlg"><svg viewBox="0 0 24 24"><path d="M12 2.5v8"/><path d="M6.6 6.2a8 8 0 1 0 10.8 0"/></svg>
      <div class="dbtn"><span class="${state===1?'hl':''}">✕</span><span class="${state===2?'hl':''}">✓</span></div></div>`:'';
    lcd.innerHTML=`<div class="ls"><span></span><span>EV3</span><span>USB ▮▮</span></div>
      <div class="lts"><div class="lt on">▶</div><div class="lt">▤</div><div class="lt">▦</div><div class="lt">✎</div></div>
      <div class="lp"><div class="lr hl">▶ DriveForward</div><div class="lr">▶ ColorStop</div></div>${dlg}`;
  }
  function pointer(){
    $$('.ptr',brick).forEach(p=>p.remove());
    $$('.bb',brick).forEach(b=>b.classList.remove('pulse'));
    if(!hints||finished||step>2)return;
    const s=STEPS[step],b=btns[s.btn];
    b.classList.add('pulse');
    const arrow=a=>`<svg viewBox="0 0 60 34" style="--a:${a}deg"><path d="M2 12h34V3l22 14-22 14v-9H2z" fill="#d6362c" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
    const badge=`<b>${step+1}</b>`;
    const p=document.createElement('div');p.className='ptr';
    const L=b.offsetLeft,T=b.offsetTop,W=b.offsetWidth,H=b.offsetHeight;
    if(s.dir==='r'){p.innerHTML=badge+arrow(0);p.style.cssText=`left:${L-6}px;top:${T+H/2}px;transform:translate(-100%,-50%);--dx:8px`}
    else if(s.dir==='l'){p.innerHTML=arrow(180)+badge;p.style.cssText=`left:${L+W+6}px;top:${T+H/2}px;transform:translate(0,-50%);--dx:-8px`}
    else{p.innerHTML=arrow(225)+badge;p.style.cssText=`left:${L+W-14}px;top:${T+H-14}px;--dx:-6px;--dy:-6px`}
    brick.appendChild(p);
  }
  function list(){
    $$('#es li').forEach((li,i)=>{li.className=i<step?'done':(i===step&&!finished?'now':'');$('b',li).textContent=i<step?'✓':i+1});
  }
  function prompt(){
    if(finished)return;
    say('idle',`<span><b>Шаг ${step+1}.</b>${hints?STEPS[step].txt+'.':'Выбери нужную кнопку на модуле.'}</span>`);
  }
  function powerOff(){
    busy=true;powerOffSound();
    $$('.ptr',brick).forEach(p=>p.remove());$$('.bb',brick).forEach(b=>b.classList.remove('pulse'));
    setTimeout(()=>{screen(3);glow.classList.remove('on')},700);
    setTimeout(()=>{
      finished=true;busy=false;list();
      if(round<3){
        say('ok',`<span><b>Модуль выключен!</b>${log[round-1].length?'Были ошибки. В следующей попытке постарайся без них.':'Без ошибок!'}</span>`);
        $('#retry').textContent=`Попытка ${round+1} из 3 →`;$('#again').hidden=false;
      }else{
        EMU_LOG.off=log.map(a=>a.slice());
        say('ok','<span><b>Тренировка закончена!</b>Три попытки выполнены. Посмотри, где были ошибки.</span>');
        $('#es').hidden=true;$('#rev').hidden=false;$('#rev').innerHTML=reviewHTML(log);
        $('#retry').textContent='Потренироваться ещё';$('#again').hidden=false;
        passBar('Тренировка пройдена! Три попытки выполнены.','К результату →',screenResult);
      }
    },1700);
  }
  function press(name){
    if(busy||finished)return;
    const b=btns[name];b.classList.add('press');setTimeout(()=>b.classList.remove('press'),150);
    tick();
    const s=STEPS[step];
    if(name===s.btn){
            say('ok',`<span><b>Верно!</b>${s.ok}</span>`);
      step++;
      if(step<3){screen(step);list();pointer();setTimeout(()=>{if(!finished&&!busy)say('idle',`<span><b>Шаг ${step+1}.</b>${hints?STEPS[step].txt+'.':'Выбери нужную кнопку на модуле.'}</span>`)},1600)}
      else{list();powerOff()}
    }else{
      log[round-1].push(`Шаг ${step+1}: нажата кнопка ${NAMES[name]}, а нужна ${NAMES[s.btn]}`);shake(b);beep(false);
      say('bad',`<span><b>Кнопка ${NAMES[name]} сейчас не нужна.</b>${hints?'Смотри на красную стрелку.':'Подумай, что нужно сделать на этом шаге.'}</span>`);
    }
  }
  brick.addEventListener('click',e=>{const b=e.target.closest('.bb');if(b)press(b.dataset.btn)});
  const KEYS={Escape:'back',Backspace:'back',ArrowRight:'right',ArrowLeft:'left',ArrowUp:'up',ArrowDown:'down',Enter:'center',' ':'center'};
  keyHandler=e=>{
    if(e.target.matches&&e.target.matches('input'))return;
    const n=KEYS[e.key];if(!n)return;e.preventDefault();press(n);
  };
  $('#hintT').onclick=()=>{
    hints=!hints;const t=$('#hintT');t.setAttribute('aria-pressed',hints);t.textContent='Подсказки: '+(hints?'включены':'выключены');
    pointer();prompt();
  };
  $('#snd').onclick=()=>$('#sndFile').click();
  $('#sndFile').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    customSound=URL.createObjectURL(f);$('#snd').textContent='Звук загружен: '+f.name.slice(0,22);
  };
  $('#retry').onclick=()=>{
    $$('.pass').forEach(x=>x.remove());
    if(round<3)round++;else{round=1;log.forEach(a=>a.length=0)}
    $('#round').textContent=`Попытка ${round} из 3`;$('#es').hidden=false;$('#rev').hidden=true;
    step=0;finished=false;busy=false;$('#again').hidden=true;
    glow.classList.add('on');powerOnSound();screen(0);list();pointer();prompt();
  };
  screen(0);list();pointer();prompt();
}


/* ================= ИТОГ ================= */
function screenResult(){
  tabs(8);toTop();
  const p=pts(),r=p/TOTAL;
  const stars=r>=.9?3:(r>=.7?2:1);
  const grade=Math.max(1,Math.round(r*10));
  const title=r>=.95?'Мастер датчика цвета':(r>=.75?'Опытный робототехник':'Юный исследователь: повтори и попробуй ещё раз');
  const wrong=[...st.mist].filter(id=>REG[id]);
  const nErr=['on','off'].reduce((n,k)=>n+(EMU_LOG[k]?EMU_LOG[k].reduce((m,a)=>m+a.length,0):0),0);
  const emuBlock=(EMU_LOG.on||EMU_LOG.off)?`<details class="emud"><summary>Просмотр ошибок в тренажёрах (ошибок: ${nErr})</summary>${EMU_LOG.on?'<h3>Включение модуля</h3>'+reviewHTML(EMU_LOG.on):''}${EMU_LOG.off?'<h3>Выключение модуля</h3>'+reviewHTML(EMU_LOG.off):''}</details>`:'';
  $('#sheet').innerHTML=`
    <h2>${st.name?esc(st.name)+', задание выполнено!':'Задание выполнено!'}</h2>
    <div class="score">
      <div class="big">${p} из ${TOTAL}</div>
      <div><div class="stars" aria-label="${stars} из 3 звёзд">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="grade">${title}</div><div>Оценка по 10-балльной шкале: <b>${grade}</b></div></div>
    </div>
    ${wrong.length?`<h2 style="font-size:20px">Повтори это</h2>
      <ul class="fix">${wrong.map(id=>{const it=REG[id];return `<li>${it.img?`<span class="mini">${imgTag(it.img,100,50,1)}</span>`:''}<span>${esc(it.name)}</span></li>`}).join('')}</ul>`
      :`<p class="task"><b>Ни одной ошибки!</b> Всё с первого раза.</p>`}
    ${emuBlock}
    <div class="row"><button class="btn" id="again2" type="button">Пройти ещё раз</button><button class="btn alt" id="print" type="button">Распечатать</button></div>`;
  $('#again2').onclick=screenStart;
  $('#print').onclick=()=>print();
}

hud();
screenStart();
})();
</script>
</body>
</html>
